<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fadii FF - Giveaway</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero-header">

        <div class="logo-area">

            <div class="brand-main">

                <div class="logo-circle">
                    <img
                        src="./images/logo.png"
                        class="site-logo"
                        alt="Fadii FF Logo"
                    >
                </div>

                <h1>
                    FADII <span>FF</span>
                </h1>

            </div>

            <div class="brand-tag">
                🔥 OFFICIAL GIVEAWAY
            </div>

            <p>
                FREE FIRE GIVEAWAY
            </p>

        </div>


        <div class="header-center">

            <h2>
                🎁 FADII FF GIVEAWAY
            </h2>

            <p>
                Spin • Win • Get Reward
            </p>

        </div>


        <div class="giveaway-status">

            <div class="status-box">

                <span>
                    STATUS
                </span>

                <strong>
                    LIVE
                </strong>

            </div>


            <div class="status-box">

                <span>
                    PLAYERS
                </span>

                <strong id="playerCount">
                    0
                </strong>

            </div>

        </div>

    </header>


    <main class="spin-page">

        <section class="spin-box">

            <h2>
                🎁 UID GIVEAWAY
            </h2>

            <p class="spin-subtitle">
                Add Free Fire Player UIDs for the giveaway
            </p>


            <div class="uid-input">

                <input
                    type="text"
                    id="uidInput"
                    placeholder="Enter Player UID"
                    autocomplete="off"
                >

                <button id="addUidBtn">
                    ADD UID
                </button>

            </div>


            <div class="players">

                <h3>
                    PLAYERS
                </h3>

                <ul id="uidList"></ul>

            </div>


            <button id="continueBtn">
                GO TO SPIN →
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
